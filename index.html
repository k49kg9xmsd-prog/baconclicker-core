<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Bacon IPA Injector</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0c0f;--card:#12151a;--card2:#171b21;--text:#f4f5f7;--muted:#8e98a7;--line:#29303a;--accent:#ff8c42;--accent2:#ffb067;--ok:#52d273;--bad:#ff5d65}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(1000px 600px at 50% -20%,#29201b 0%,var(--bg) 58%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC",system-ui,sans-serif;color:var(--text);min-height:100vh}
    main{width:min(760px,calc(100% - 28px));margin:0 auto;padding:52px 0 64px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:28px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--accent2),var(--accent));display:grid;place-items:center;font-size:25px;box-shadow:0 12px 35px #ff8c4230}.title h1{font-size:22px;margin:0 0 3px}.title p{margin:0;color:var(--muted);font-size:13px}
    .card{background:linear-gradient(180deg,#15191fdd,#101318ee);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 28px 80px #0008;backdrop-filter:blur(16px)}
    .drop{min-height:260px;border:1.5px dashed #3b4553;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;transition:.2s;background:#0c0f1355;cursor:pointer}.drop.drag{border-color:var(--accent);background:#ff8c420c;transform:scale(.997)}.drop .ico{font-size:45px;margin-bottom:12px}.drop strong{font-size:18px}.drop small{display:block;margin-top:8px;color:var(--muted);line-height:1.5}.choose{margin-top:18px;border:0;border-radius:13px;background:#252b34;color:white;padding:11px 17px;font-weight:650;font-size:14px}
    input[type=file]{display:none}.file{display:none;margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;align-items:center;gap:12px}.file.show{display:flex}.file .ficon{font-size:26px}.file .meta{min-width:0;flex:1}.file .name{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file .size{font-size:12px;color:var(--muted);margin-top:4px}.remove{border:0;background:transparent;color:#9aa4b1;font-size:20px;padding:7px}
    .info{margin:14px 2px;color:var(--muted);font-size:12px;line-height:1.65}.info b{color:#cfd5dd}.go{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#17100a;font-size:16px;font-weight:800;box-shadow:0 12px 30px #ff8c4228;opacity:.45;pointer-events:none;transition:.2s}.go.ready{opacity:1;pointer-events:auto}.go:active{transform:scale(.992)}
    .status{display:none;margin-top:14px;border-radius:15px;padding:13px 14px;font-size:13px;line-height:1.55;background:#171b21;border:1px solid var(--line)}.status.show{display:block}.status.ok{border-color:#2f6840;color:#baf1c7}.status.bad{border-color:#71333a;color:#ffc4c7}.bar{height:4px;border-radius:4px;background:#242a32;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:28%;background:var(--accent);animation:move 1s linear infinite}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(470%)}}
    footer{text-align:center;color:#6f7885;font-size:11px;margin-top:20px;line-height:1.6}@media(max-width:520px){main{padding-top:28px}.card{border-radius:20px;padding:13px}.drop{min-height:230px}}
  </style>
</head>
<body>
<main>
  <div class="brand"><div class="logo">🥓</div><div class="title"><h1>Bacon IPA Injector</h1><p>直接把 BaconClicker Core 寫進 IPA</p></div></div>
  <section class="card">
    <label class="drop" id="drop" for="ipa">
      <div class="ico">📦</div><strong>把 IPA 丟進來</strong><small>或點一下選擇檔案<br>輸出會是未簽名 IPA</small>
      <span class="choose">選擇 IPA</span>
    </label>
    <input id="ipa" type="file" accept=".ipa,application/octet-stream" />
    <div class="file" id="file"><div class="ficon">📱</div><div class="meta"><div class="name" id="name"></div><div class="size" id="size"></div></div><button class="remove" id="remove" type="button">×</button></div>
    <div class="info"><b>注入方式：</b>主程式加入 <code>LC_LOAD_DYLIB</code>，插件放入 <code>Frameworks/BaconClickerCore.dylib</code>。處理後請用 <b>KSign</b> 重新簽整個 IPA 再安裝。</div>
    <button class="go" id="go" type="button">注入 BaconClicker</button>
    <div class="status" id="status"></div>
  </section>
  <footer>伺服器不需要你的 .p12 或憑證密碼。簽名請留在 KSign 端完成。</footer>
</main>
<script>
const input=document.querySelector('#ipa'),drop=document.querySelector('#drop'),box=document.querySelector('#file'),nameEl=document.querySelector('#name'),sizeEl=document.querySelector('#size'),go=document.querySelector('#go'),status=document.querySelector('#status'),remove=document.querySelector('#remove');
let selected=null;
const fmt=n=>n<1024*1024?(n/1024).toFixed(1)+' KB':n<1024**3?(n/1024/1024).toFixed(1)+' MB':(n/1024**3).toFixed(2)+' GB';
function setFile(f){if(!f)return;if(!f.name.toLowerCase().endsWith('.ipa')){show('請選擇 .ipa 檔案。',false);return}selected=f;nameEl.textContent=f.name;sizeEl.textContent=fmt(f.size);box.classList.add('show');go.classList.add('ready');status.className='status';}
input.addEventListener('change',()=>setFile(input.files[0]));
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
remove.addEventListener('click',()=>{selected=null;input.value='';box.classList.remove('show');go.classList.remove('ready');status.className='status'});
function show(msg,ok=null,busy=false){status.className='status show'+(ok===true?' ok':ok===false?' bad':'');status.innerHTML=msg+(busy?'<div class="bar"><i></i></div>':'')}
go.addEventListener('click',async()=>{
 if(!selected)return;go.classList.remove('ready');go.textContent='正在注入…';show('正在解包 IPA、修改 Mach-O 並重新打包…',null,true);
 const fd=new FormData();fd.append('ipa',selected,selected.name);
 try{
   const r=await fetch('/api/inject',{method:'POST',body:fd});
   if(!r.ok){let msg='處理失敗';try{const j=await r.json();msg=j.detail||msg}catch{}throw new Error(msg)}
   const blob=await r.blob();let cd=r.headers.get('content-disposition')||'';let m=cd.match(/filename="?([^";]+)"?/i);let out=m?m[1]:selected.name.replace(/\.ipa$/i,'')+'-BaconInjected-Unsigned.ipa';
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=out;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
   show('✅ 注入完成，已產生 <b>'+out.replaceAll('<','&lt;')+'</b><br>下一步：用 KSign 重簽整個 IPA 再安裝。',true);
 }catch(e){show('❌ '+e.message,false)}finally{go.textContent='注入 BaconClicker';if(selected)go.classList.add('ready')}
});
</script>
</body>
</html>
