<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bacon IPA</title>
<style>
*{box-sizing:border-box}
:root{
  color-scheme:light dark;
  --bg:#f4f4f6;
  --panel:#fff;
  --text:#111;
  --muted:#777;
  --line:#e7e7ea;
  --primary:#111;
  --primaryText:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0b0c;
    --panel:#171718;
    --text:#f5f5f5;
    --muted:#8f8f95;
    --line:#2a2a2d;
    --primary:#f5f5f5;
    --primaryText:#111;
  }
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.app{width:min(390px,100%)}
.top{margin-bottom:18px}
.title{font-size:28px;font-weight:750;letter-spacing:-.6px;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.file{height:52px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.fileName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{appearance:none;-webkit-appearance:none;height:50px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-size:16px;font-weight:650;-webkit-tap-highlight-color:transparent}
button.primary{grid-column:1/-1;background:var(--primary);color:var(--primaryText);border-color:var(--primary)}
button:disabled{opacity:.32}
button:active{transform:scale(.985)}
input{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 class="title">Bacon IPA</h1></div>
  <div class="panel">
    <div class="file"><div class="fileName" id="fileName">尚未選擇 IPA</div></div>
    <div class="grid">
      <button id="upload">選擇 IPA</button>
      <button id="convert" class="primary" disabled>轉換</button>
      <button id="share" disabled>分享</button>
      <button id="download" disabled>下載</button>
    </div>
    <input id="ipa" type="file" accept=".ipa,application/octet-stream">
  </div>
</div>

function align8(n){return (n+7)&~7}
function u32le(d,o){return new DataView(d.buffer,d.byteOffset,d.byteLength).getUint32(o,true)}
function u32be(d,o){return new DataView(d.buffer,d.byteOffset,d.byteLength).getUint32(o,false)}
function u64be(d,o){const v=new DataView(d.buffer,d.byteOffset,d.byteLength).getBigUint64(o,false);return Number(v)}

function loadedDylibs(data,sl){const p=parseLoadCommands(data,sl), names=new Set(), cmds=new Set([LC_LOAD_DYLIB,0x18,0x1F,0x80000018,0x8000001F]);const dec=new TextDecoder();for(const [off,cmd,cmdsize] of p.commands){if(!cmds.has(cmd))continue;const no=u32le(data,off+8),start=off+no,max=off+cmdsize;let end=start;while(end<max&&data[end]!==0)end++;names.add(dec.decode(data.slice(start,end)))}return names}

async function injectIPA(file,onProgress){
 onProgress?.('正在讀取 IPA…');const buf=await file.arrayBuffer();

const input=document.getElementById('ipa');
const upload=document.getElementById('upload');
const convert=document.getElementById('convert');
const share=document.getElementById('share');
const download=document.getElementById('download');
let selected=null,outputBlob=null,outputFile=null,outputName='',outputUrl=null;
function resetOutput(){
 if(outputUrl) URL.revokeObjectURL(outputUrl);
 outputBlob=null; outputFile=null; outputName=''; outputUrl=null;
 share.disabled=true; download.disabled=true;
}
upload.onclick=()=>input.click();
input.onchange=()=>{
 const f=input.files&&input.files[0];
 if(!f||!f.name.toLowerCase().endsWith('.ipa')) return;
 selected=f; resetOutput(); convert.disabled=false;
 const name=document.getElementById('fileName');
 if(name) name.textContent=f.name;
};
convert.onclick=async()=>{
 if(!selected)return;
 resetOutput();
 upload.disabled=true; convert.disabled=true; share.disabled=true; download.disabled=true;
 const old=convert.textContent; convert.textContent='轉換中';
 try{
   const r=await injectIPA(selected);
   outputName=selected.name.replace(/\.ipa$/i,'')+'-BaconInjected-Unsigned.ipa';
   outputBlob=r.blob;
   outputFile=new File([r.blob],outputName,{type:'application/octet-stream'});
   outputUrl=URL.createObjectURL(r.blob);
   share.disabled=false; download.disabled=false;
 }catch(e){console.error(e)}
 finally{
   upload.disabled=false; convert.disabled=false; convert.textContent=old;
 }
};
share.onclick=async()=>{
 if(!outputFile)return;
 try{
   if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[outputFile]}))){
     await navigator.share({files:[outputFile]});
   }
 }catch(e){if(!e||e.name!=='AbortError')console.error(e)}
};
download.onclick=()=>{
 if(!outputUrl)return;
 const a=document.createElement('a');
 a.href=outputUrl; a.download=outputName; a.rel='noopener';
 document.body.appendChild(a); a.click(); a.remove();
};
window.addEventListener('pagehide',()=>{if(outputUrl)URL.revokeObjectURL(outputUrl)});
</script></body></html>
